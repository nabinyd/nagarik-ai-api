services:
  nagrik-ai:
    build:
      context: .
      dockerfile: Dockerfile

    image: nagrik-ai:local
    container_name: nagrik-ai-local
    restart: unless-stopped

    env_file:
      - .env

    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 5000

    ports:
      - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: sync+restart
          path: ./alembic
          target: /app/alembic
        - action: sync+restart
          path: ./run.py
          target: /app/run.py
        - action: sync+restart
          path: ./alembic.ini
          target: /app/alembic.ini
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile

    # healthcheck:
    #   test:
    #     - CMD
    #     - python
    #     - -c
    #     - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 360s

  postgres:
    image: postgres:17
    container_name: nagrik-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-nagarik_ai}
      POSTGRES_USER: ${POSTGRES_USER:-nagarik_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432" # Bind to localhost for security

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
