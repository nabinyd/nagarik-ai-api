services:
  nagrik-ai:
    build:
      context: .
      dockerfile: Dockerfile

    image: nagrik-ai:local
    container_name: nagrik-ai-local
    restart: unless-stopped

    env_file:
      - .env

    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 5000

    ports:
      - "5000:5000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s
