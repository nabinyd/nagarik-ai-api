name: Deploy Staging

on:
  push:
    branches:
      - stage

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy Nagarikai Staging

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging VM
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}

          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -eu

            cd /opt/nagarik-ai/backend/staging

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            export NAGRIK_AI_IMAGE="ghcr.io/${{ github.repository_owner }}/nagrik-ai:${IMAGE_TAG}"

            docker compose -f docker-compose.stage.yml pull nagrik-ai-staging

            docker compose -f docker-compose.stage.yml up -d \
              --no-build \
              --force-recreate \
              nagrik-ai-staging

            sleep 10

            docker compose -f docker-compose.stage.yml ps

            STATUS=$(docker inspect nagrik-ai-staging \
              --format='{{.State.Health.Status}}' 2>/dev/null || echo "missing")

            if [ "$STATUS" != "healthy" ]; then
              echo "Staging health check failed: $STATUS"
              docker logs --tail 100 nagrik-ai-staging
              exit 1
            fi

            docker image prune -f

            echo "Nagarikai staging deployment successful."
