name: Build & Push FastAPI to GHCR

on:
  push:
    branches: [stage]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/nabinyd/nagarik-ai-api:staging .

      - name: Push image
        run: |
          docker push ghcr.io/nabinyd/nagarik-ai-api:staging
