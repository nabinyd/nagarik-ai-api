services:
  nagrik-ai-staging:
    image: ${NAGRIK_AI_IMAGE:?NAGRIK_AI_IMAGE is required}
    container_name: nagrik-ai-staging
    restart: unless-stopped
    pull_policy: always

    env_file:
      - .env.staging

    environment:
      ENVIRONMENT: staging
      HOST: 0.0.0.0
      PORT: 5000

    ports:
      - "5001:5000"

    networks:
      - nagrik-ai-network-staging

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

networks:
  nagrik-ai-network-staging:
    driver: bridge
