services:
  nagrik-ai-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagrik-ai-staging
    restart: unless-stopped

    env_file:
      - .env.staging

    environment:
      - ENVIRONMENT=staging
      - HOST=0.0.0.0
      - PORT=5000

    ports:
      - "5001:5000"

    networks:
      - nagrik-ai-network-staging

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nagrik-ai-network-staging:
    driver: bridge
