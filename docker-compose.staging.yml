services:
  nagrik-ai-staging:
    image: ghcr.io/nabinyd/nagarik-ai-api:staging
    container_name: nagrik-ai-staging
    restart: unless-stopped

    ports:
      - "5001:5000"

    environment:
      - ENVIRONMENT=staging
      - HOST=0.0.0.0
      - PORT=5000

    env_file:
      - .env.staging

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
